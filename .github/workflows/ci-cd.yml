name: CI CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: mango-drinksserviceS
  CONTAINER_NAME: mango-drink
  APP_PORT: '6666'
  DEPLOY_HOST: 192.99.71.97
  VM_USER: ubuntu
  VM_PORT: '22'

jobs:
  build_and_push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Deploy the latest image on the VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          port: ${{ env.VM_PORT }}
          script: |
            set -e
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull "$IMAGE"
            docker stop "${{ env.CONTAINER_NAME }}" || true
            docker rm "${{ env.CONTAINER_NAME }}" || true
            docker run -d \
              --name "${{ env.CONTAINER_NAME }}" \
              --restart unless-stopped \
              -p "${{ env.APP_PORT }}:${{ env.APP_PORT }}" \
              "$IMAGE"
            docker image prune -f

            curl --fail --silent --show-error --insecure "https://${{ env.DEPLOY_HOST }}:${{ env.APP_PORT }}/" >/dev/null



  trigger_external_qa:
    name: Trigger external QA repository
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Repository dispatch to QA repo
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.QA_TRIGGER_TOKEN }}
          repository: ${{ secrets.QA_REPO_OWNER }}/${{ secrets.QA_REPO_NAME }}
          event-type: run-qa-tests
          client-payload: |
            {"app_url":"https://${{ env.DEPLOY_HOST }}:${{ env.APP_PORT }}","username":"${{ secrets.APP_USERNAME }}","password":"${{ secrets.APP_PASSWORD }}"}